<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>CISSP Coach</title>
  <meta name="description" content="Offline CISSP prep: adaptive questions, flashcards, mock tests." />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CISSP" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Screens: all in the DOM, toggled by the hash router in js/ui.js.
       Tab screens show the tab bar; fullscreen screens (play, cardplay,
       mockrun, mockresult, settings, domain) hide it via body.fullscreen. -->
  <main id="app">
    <section id="s-coach" class="screen" hidden></section>
    <section id="s-drill" class="screen" hidden></section>
    <section id="s-domain" class="screen" hidden></section>
    <section id="s-cards" class="screen" hidden></section>
    <section id="s-mock" class="screen" hidden></section>
    <section id="s-progress" class="screen" hidden></section>
    <section id="s-play" class="screen" hidden></section>
    <section id="s-cardplay" class="screen" hidden></section>
    <section id="s-mockrun" class="screen" hidden></section>
    <section id="s-mockresult" class="screen" hidden></section>
    <section id="s-settings" class="screen" hidden></section>
  </main>
  <nav id="tabbar" aria-label="Primary">
    <button type="button" data-tab="coach" aria-label="Coach"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M5 17l.7 1.6 1.6.6-1.6.6L5 21.4l-.7-1.6-1.6-.6 1.6-.6z"/></svg><span>Coach</span></button>
    <button type="button" data-tab="drill" aria-label="Drill"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/></svg><span>Drill</span></button>
    <button type="button" data-tab="cards" aria-label="Flashcards"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="13" rx="2"/><path d="M8 6V4M16 6V4"/></svg><span>Cards</span></button>
    <button type="button" data-tab="mock" aria-label="Mock test"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l1 2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3z"/><path d="M9 12l2 2 4-4"/></svg><span>Mock</span></button>
    <button type="button" data-tab="progress" aria-label="Progress"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7"/></svg><span>Progress</span></button>
  </nav>
  <div id="sheet-root"></div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
